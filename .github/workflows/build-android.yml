name: Build & distribute Android APK

on:
  push:
    branches:
      - claude/creer-projet-ecrans-e3oqnb
      - main
  workflow_dispatch: {} # bouton "Run workflow" dans l'onglet Actions de GitHub

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # APK "universel" (armeabi-v7a 32-bit + arm64-v8a 64-bit + x86_64),
      # minSdk 31 (Android 12+) défini dans android/app/build.gradle.kts.
      - name: Build release APK
        run: flutter build apk --release

      - name: Distribute to Firebase App Distribution
        if: ${{ vars.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message || 'Build manuel' }}

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: drugs-ia-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
